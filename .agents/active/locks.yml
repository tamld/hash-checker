# AA File Lock Registry
# Purpose: Prevent git conflicts by coordinating file access across multiple AAs
# Location: .agents/active/locks.yml
# Protocol: Acquire lock BEFORE editing, release AFTER commit

---

## Schema Definition

# Lock Structure:
#   file: string (relative path from repo root)
#   holder: string (cursor | codex | gemini)
#   acquired: ISO 8601 timestamp
#   reason: string (why editing this file)
#   expires: ISO 8601 timestamp (optional, auto-release)

---

