# File Lock Registry
# Purpose: Prevent git conflicts in multi-AA environment
# Format: YAML (real-time updates, AA-parseable)
# Updated: 2025-10-27T18:30:00Z

schema_version: "1.0"
last_updated: "2025-10-27T18:30:00Z"

# Schema Definition (embedded for AA autonomy)
# Fields:
#   - id: string (unique, format: lock-[timestamp])
#   - path: string (file or directory path)
#   - owner: string (AA name: cursor|codex|gemini)
#   - claimed_at: ISO8601 timestamp
#   - eta: ISO8601 timestamp (expected release time)
#   - max_eta: ISO8601 timestamp (hard deadline, auto-release after this)
#   - status: enum [active, released, stale]
#   - released_at: ISO8601 timestamp | null
#   - task_id: string (reference to tasks.yml)

locks: []
# No active locks at session start

# Example lock entry (for reference):
# - id: "lock-1730052000"
#   path: ".agents/workflows/COORDINATION_RULES.md"
#   owner: "codex"
#   claimed_at: "2025-10-27T18:00:00Z"
#   eta: "2025-10-27T18:20:00Z"
#   max_eta: "2025-10-27T18:30:00Z"
#   status: "active"
#   released_at: null
#   task_id: "phase2-codex-coordination-rules"

critical_sections:
  # These files require sequential access (no concurrent edits)
  - ".github/workflows/*.yml"
  - "Cargo.toml"
  - "rust/Cargo.lock"
  - "README.md"
  - ".gitignore"

# Automation Examples (for AA self-service)
#
# Acquire lock:
#   LOCK_ID="lock-$(date +%s)"
#   yq -i ".locks += [{\"id\": \"$LOCK_ID\", \"path\": \"file.md\", \"owner\": \"cursor\", \"claimed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"eta\": \"$(date -u -d '+20 minutes' +%Y-%m-%dT%H:%M:%SZ)\", \"max_eta\": \"$(date -u -d '+30 minutes' +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"active\", \"released_at\": null, \"task_id\": \"my-task\"}]" locks.yml
#
# Check if file is locked:
#   yq ".locks[] | select(.path==\"file.md\" and .status==\"active\") | .owner" locks.yml
#   # If output exists, file is locked by that owner
#
# Release lock:
#   yq -i "(.locks[] | select(.id==\"lock-123\")) |= (.status = \"released\" | .released_at = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\")" locks.yml
#
# Check stale locks (past max_eta):
#   yq ".locks[] | select(.status==\"active\" and .max_eta < \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\") | .id" locks.yml
#
# Auto-release stale locks:
#   for lock_id in $(yq ".locks[] | select(.status==\"active\" and .max_eta < \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\") | .id" locks.yml); do
#     yq -i "(.locks[] | select(.id==\"$lock_id\")) |= (.status = \"stale\" | .released_at = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\")" locks.yml
#   done
