## Best Practices

1. **Always check before editing critical files**
   - Don't assume file is available
   - Check locks.yml first

2. **Acquire lock BEFORE pulling latest**
   - Prevents race condition
   - Ensures exclusive access

3. **Keep lock time SHORT**
   - Acquire → Edit → Commit → Release
   - Don't hold locks during breaks

4. **Set expires for long tasks**
   - Auto-release if abandoned
   - Prevents permanent locks

5. **Use descriptive reasons**
   - Others know why locked
   - Can coordinate if urgent

6. **Release even if commit fails**
   - Don't leave orphan locks
   - Clean up on error

---

## Conflict Resolution

### If two AAs acquire same lock simultaneously:

Git will conflict on locks.yml itself. Resolution:

1. Pull latest:
   ```bash
   git pull
   ```

2. Check locks.yml conflict:
   - Keep EARLIEST acquired timestamp
   - That AA "won" the lock

3. Loser AA:
   - Remove own lock entry
   - Wait or work on different file

4. Commit resolution:
   ```bash
   git add locks.yml
   git commit -m "lock: resolve conflict, defer to WINNER"
   git push
   ```

