## Monitoring

### Lock statistics:
```bash
echo "Active locks: $(yq '.locks | length' locks.yml)"
echo "Cursor: $(yq '.locks[] | select(.holder=="cursor") | .file' locks.yml | wc -l)"
echo "Codex: $(yq '.locks[] | select(.holder=="codex") | .file' locks.yml | wc -l)"
echo "Gemini: $(yq '.locks[] | select(.holder=="gemini") | .file' locks.yml | wc -l)"
```

