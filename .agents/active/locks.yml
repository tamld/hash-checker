## Critical Sections

# Files that MUST use locks (high conflict risk):
critical_sections:
  - ".github/workflows/*.yml"
  - ".agents/handoffs/*.md"
  - ".agents/active/tasks.yml"
  - ".agents/active/locks.yml"
  - "Cargo.toml"
  - "Cargo.lock"
  - "package.json"
  - "package-lock.json"
  - "README.md"
  - ".gitignore"

# For these files: ALWAYS acquire lock before editing

---

## Lock Protocol

### Before Editing Critical File:

1. Check if locked:
   ```bash
   yq '.locks[] | select(.file=="PATH/TO/FILE")' locks.yml
   ```

2. If locked (output exists):
   - Wait for release OR
   - Contact holder OR
   - Work on different file

3. If NOT locked (no output):
   - Acquire lock:
   ```bash
   yq -i '.locks += [{"file": "PATH/TO/FILE", "holder": "YOUR_NAME", "acquired": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "reason": "Your reason"}]' .agents/active/locks.yml
   git add .agents/active/locks.yml
   git commit -m "lock: acquire PATH/TO/FILE"
   git push
   ```

4. Edit the file (you now have exclusive access)

5. Commit your changes:
   ```bash
   git add PATH/TO/FILE
   git commit -m "your changes"
   ```

6. Release lock:
   ```bash
   yq -i 'del(.locks[] | select(.file=="PATH/TO/FILE" and .holder=="YOUR_NAME"))' .agents/active/locks.yml
   git add .agents/active/locks.yml
   git commit -m "lock: release PATH/TO/FILE"
   git push
   ```

