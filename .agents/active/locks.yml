## Automation Examples

### Check if file is locked:
```bash
FILE="path/to/file"
LOCK=$(yq '.locks[] | select(.file=="'$FILE'")' locks.yml)
if [ -n "$LOCK" ]; then
  echo "LOCKED by: $(echo $LOCK | yq '.holder')"
  exit 1
else
  echo "AVAILABLE - can acquire lock"
fi
```

### Acquire lock (safe):
```bash
FILE="path/to/file"
HOLDER="cursor"
REASON="Editing for task X"

# Check not already locked
if yq -e '.locks[] | select(.file=="'$FILE'")' locks.yml >/dev/null 2>&1; then
  echo "ERROR: File already locked"
  exit 1
fi

# Acquire lock
yq -i '.locks += [{"file": "'$FILE'", "holder": "'$HOLDER'", "acquired": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "reason": "'$REASON'"}]' locks.yml
git add locks.yml
git commit -m "lock: acquire $FILE ($REASON)"
git push
```

### Release lock:
```bash
FILE="path/to/file"
HOLDER="cursor"

yq -i 'del(.locks[] | select(.file=="'$FILE'" and .holder=="'$HOLDER'"))' locks.yml
git add locks.yml
git commit -m "lock: release $FILE"
git push
```

### List all current locks:
```bash
yq '.locks[] | .file + " (held by " + .holder + ")"' locks.yml
```

### Auto-expire old locks (>1 hour):
```bash
NOW=$(date -u +%s)
yq -i 'del(.locks[] | select(.acquired | sub("T.*", "") | fromdateiso8601 < ('$NOW' - 3600)))' locks.yml
```

