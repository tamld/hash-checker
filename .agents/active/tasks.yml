## Task Claiming Protocol

### How to Claim a Task:

1. Read this file (tasks.yml)
2. Find task with status: pending
3. Check blocked_by: null (no dependencies)
4. Update task:
   ```bash
   # Claim task (set status + assignee)
   yq -i '(.tasks[] | select(.id=="TASK_ID")) |= (.status = "in_progress" | .assignee = "YOUR_NAME" | .started = "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'")' .agents/active/tasks.yml
   ```
5. Commit changes:
   ```bash
   git add .agents/active/tasks.yml
   git commit -m "task: claim TASK_ID"
   git push
   ```
6. Do the work
7. Mark complete:
   ```bash
   yq -i '(.tasks[] | select(.id=="TASK_ID")) |= (.status = "completed" | .completed = "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'")' .agents/active/tasks.yml
   ```

### Important:
- Always pull latest before claiming (avoid conflicts)
- Update actual_time after completion (evidence-based)
- Add validation results (did success criteria pass?)

