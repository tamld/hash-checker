# AA Task Registry
# Purpose: Central task discovery and claiming system for multi-AA coordination
# Location: .agents/active/tasks.yml
# Updated: Auto-updated by AAs when claiming/completing tasks

---

## Schema Definition

# Task Structure:
#   id: string (unique, kebab-case)
#   title: string (short description)
#   description: string (detailed requirements)
#   status: pending | in_progress | completed | blocked | cancelled
#   priority: critical | high | medium | low
#   assignee: null | cursor | codex | gemini
#   created: ISO 8601 timestamp
#   started: ISO 8601 timestamp (when claimed)
#   completed: ISO 8601 timestamp (when done)
#   blocked_by: null | task_id (dependency)
#   estimated_time: string (e.g., "5 mins", "1 hour")
#   actual_time: string (measured after completion)
#   validation: list of success criteria

---

