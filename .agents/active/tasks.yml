## Automation Examples

### Find available tasks:
```bash
yq '.tasks[] | select(.status=="pending" and .blocked_by==null) | .id + ": " + .title' tasks.yml
```

### Claim first available task:
```bash
TASK_ID=$(yq '.tasks[] | select(.status=="pending" and .blocked_by==null) | .id' tasks.yml | head -1)
yq -i "(.tasks[] | select(.id==\"$TASK_ID\")) |= (.status = \"in_progress\" | .assignee = \"cursor\" | .started = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\")" tasks.yml
```

### List my tasks:
```bash
yq '.tasks[] | select(.assignee=="cursor") | .id + " (" + .status + ")"' tasks.yml
```

