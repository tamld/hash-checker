session_workflow:
  lifecycle:
    - step: "Prepare"
      actions:
        - "Run `make clean` (repository root) to remove previous build artefacts and Docker volumes."
        - "Read `.agents/agent_guide.yml`, `.agents/gui_manifest_todo.yml`, and issue #24 before making any changes."
        - "If work ties to a new ticket, create `specs/<ticket>/plan.md` from template and draft handoff.md."
        - "Ensure `.agents/branch_progress.yml` exists (copy from template if absent) and fill in branch/session metadata before making code changes."
        - "Record or update the matching entry in `.agents/metrics_log.yml` to note that the session has started."
    - step: "Build & Test"
      actions:
        - "Build DMG via `CARGO_TARGET_DIR=/tmp/hash-checker-target make macos-dmg-universal`."
        - "Record DMG output path and mount it using `hdiutil attach`."
        - "Execute `cargo test` for `rust/hash-checker` (and GUI tests when available)."
        - "When preparing handoff, run `.agents/scripts/validate_handoff.sh <branch>` to ensure branch_progress completeness."
        - "Update milestones in `.agents/branch_progress.yml` as each verification step completes."
    - step: "Deliverables"
      actions:
        - "Report DMG path, mount point, and quick run commands:"
        - "`open /Volumes/<mount>/Hash\\ Checker.app`"
        - "`/Volumes/<mount>/Hash\\ Checker.app/Contents/MacOS/hash-checker-gui`"
        - "Capture updated screenshots when UI changes."
        - "Post status + next steps in issue #24."
        - "Update `.agents/lessons.yml` with findings."
    - step: "Responsive & Functional Checks"
      actions:
        - "Validate layout with `docs/GUI_MANIFEST_PLAN.md` responsive rules."
        - "Ensure Directory Manifest scan/verify flow follows spec (no auto-match after scan)."
    - step: "Wrap-up"
      actions:
        - "Detach mounted volume (`hdiutil detach <mount>`)."
        - "Confirm `.agents/` files and issue tracker reflect the current session state."
        - "Log metrics in `.agents/metrics_log.yml` (handoff latency, CI status, Codex iterations)."
        - "Remove temporary build dirs (`/tmp/hash-checker-*`, `logs/tmp-*`) and run `make clean` again if new artefacts were produced."

  internal_source_of_truth:
    description:
      - "The `.agents/` directory stores project-specific guidance, backlog, and lessons for AI agents."
      - "All sessions must consult `.agents/` (YAML/JSON files) after MCP-Server global laws and must update the files before ending the session."
