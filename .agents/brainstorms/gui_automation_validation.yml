meta:
  created: 2025-10-26
  owner: platform-team
  status: open
  related_branch: feature/gui-automation-harness-issue56
  objective: "Define the next evolution of GUI automation after the stabilization pass."

problem_statement:
  summary: >
    Current branch replaces invalid tests and workflows, but lacks true headless coverage
    and automated verification of telemetry/validation tooling.
  risks:
    - "CI matrix still unproven on hosted runners."
    - "No regression guards for scripts/analyze_telemetry.py and validate_framework.sh."
    - "Headless-mode CLI contract undefined, preventing meaningful GUI automation."

goals:
  - "Publish a real headless CLI spec for hash-checker-gui (Phase A)."
  - "Add unit tests for telemetry/compliance scripts and run the GUI workflow in CI (Phase B)."

phases:
  - id: "Phase A"
    focus: "Specification + CLI proof"
    deliverables:
      - name: "Headless CLI RFC"
        notes: "Capture required flags, exit codes, artefact outputs; agreed by tech lead."
      - name: "CLI smoke tests aligned to RFC"
        notes: "Extend gui_cli_smoke.rs (or equivalent) to cover headless contract."
    evidence_required:
      - "cargo test --manifest-path rust/hash-checker-gui/Cargo.toml --tests (log attached)."
      - "RFC stored under docs/ or .agents/records with reviewer sign-off."
  - id: "Phase B"
    focus: "Tooling + CI verification"
    deliverables:
      - name: "Telemetry/Performance script unit tests"
        notes: "pytest/unittest covering happy path + malformed input."
      - name: "GUI workflow dry-run report"
        notes: "GitHub Actions run link, timings, cache hit observations."
    evidence_required:
      - "pytest (or equivalent) log for scripts/analyze_telemetry.py and check_performance_regression.py."
      - "Actions run URL + summary appended to .agents/records/gui_automation_harness_issue56.md."

next_steps:
  - "Assign owner + due date for Phase A RFC (Codex đề xuất, Cursor thực thi)."
  - "Create issues for Phase B tooling tests + CI dry-run (link vào backlog)."
  - "Update .agents/records/gui_automation_harness_issue56.md khi mỗi phase hoàn thành."

notes: >
  This brainstorm tracks the follow-up work necessary to move from 'stabilised scaffolding'
  to a production-ready GUI automation harness. Update status and deliverables as items are
  completed.
