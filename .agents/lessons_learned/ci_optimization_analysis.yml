# CI Pipeline Optimization Analysis
# Focus: Eliminate unnecessary CI, optimize effort for right goals
# Date: 2025-10-27
# Analyzer: Cursor (Claude 4.5 Sonnet)

schema_version: "1.0"
analysis_date: "2025-10-27T17:30:00Z"
ci_workflows_analyzed: 8
focus_platform: "linux"
problem: "Linux CI takes 27 minutes, wastes resources on unnecessary checks"

# =============================================================================
# CURRENT STATE ANALYSIS
# =============================================================================

current_ci_state:
  
  workflows_inventory:
    total_workflows: 8
    list:
      - ci.yml                        # Main CI (all platforms)
      - gui-automation.yml           # GUI-specific tests
      - release.yml                  # Release packaging
      - nightly-packaging.yml        # Nightly builds
      - dist-validation.yml          # Distribution validation
      - cargo-dist-maintenance.yml   # Dependency updates
      - deps-refresh.yml             # Dependency refresh
      - vagrant-smoke-reminder.yml   # Vagrant smoke test reminder
  
  linux_ci_duration:
    current: "~27 minutes"
    breakdown:
      setup: "~2 min (checkout, rust toolchain, system deps)"
      linting: "~2 min (fmt, clippy x2)"
      testing: "~8 min (cargo test x2, GUI automation)"
      benchmarks: "~3 min (cargo bench)"
      docker_tests: "~5 min (make rust-test)"
      gui_smoke: "~2 min (GUI smoke test)"
      gtk4_native: "~3 min (compile + dbus smoke test)"
      security_tools_install: "~2 min (cargo-audit, cargo-deny INSTALL)"
      security_checks: "~3 min (audit x2, deny)"
      
    total: "~27-30 minutes per run"
    
    comparison:
      macos: "~5 minutes"
      windows: "~6 minutes"
      
    problem: "Linux 5x slower than macOS/Windows"

# =============================================================================
# ROOT CAUSE ANALYSIS
# =============================================================================

root_causes:
  
  cause_1_redundant_security_tool_installation:
    severity: "HIGH"
    description: "cargo-audit and cargo-deny are installed EVERY CI run"
    cost: "~2 minutes per run"
    
    evidence:
      file: ".github/workflows/ci.yml"
      lines: "86-88"
      code: |
        - name: Install security tooling
          run: |
            cargo install cargo-audit --locked
            cargo install cargo-deny --locked
    
    fix: "Cache these tools (they don't change often)"
    potential_savings: "2 minutes per run"
  
  cause_2_unnecessary_benchmarks_on_every_pr:
    severity: "MEDIUM"
    description: "Benchmarks run on every PR, even for doc-only changes"
    cost: "~3 minutes per run"
    
    evidence:
      file: ".github/workflows/ci.yml"
      lines: "56-57"
      code: |
        - name: Cargo bench (hash-checker)
          run: cargo bench --manifest-path rust/hash-checker/Cargo.toml
    
    rationale_for_removal:
      - "Benchmarks are expensive"
      - "Not needed for every PR (only for performance-critical changes)"
      - "Can run benchmarks manually or on release"
    
    fix: "Move benchmarks to manual trigger or release-only"
    potential_savings: "3 minutes per run"
  
  cause_3_docker_tests_on_every_pr:
    severity: "MEDIUM"
    description: "Docker tests run on every PR, even for non-Docker changes"
    cost: "~5 minutes per run"
    
    evidence:
      file: ".github/workflows/ci.yml"
      lines: "58-59"
      code: |
        - name: Rust tests (Docker)
          run: make rust-test
    
    rationale_for_optimization:
      - "Docker build + test is expensive"
      - "Only needed when Docker files or scripts change"
      - "Native cargo test already covers Rust code"
    
    fix: "Skip unless Docker-related files changed"
    potential_savings: "5 minutes per run (when skipped)"
  
  cause_4_gtk4_native_tests_always_run:
    severity: "LOW"
    description: "GTK4-native tests run even for CLI-only changes"
    cost: "~3 minutes per run"
    
    evidence:
      file: ".github/workflows/ci.yml"
      lines: "62-69"
      code: |
        - name: GTK4-native compile check
        - name: GTK4-native smoke test (dbus session)
    
    rationale_for_optimization:
      - "GTK4 tests only needed for GUI changes"
      - "CLI changes don't affect GTK4"
    
    fix: "Skip unless GUI files changed"
    potential_savings: "3 minutes per run (when skipped)"
  
  cause_5_no_path_filtering:
    severity: "HIGH"
    description: "CI runs for ALL changes, even docs-only"
    cost: "27 minutes wasted on docs-only PRs"
    
    evidence:
      file: ".github/workflows/ci.yml"
      lines: "4-7"
      code: |
        on:
          push:
            branches: ["main"]
          pull_request:
            branches: ["main"]
    
    problem: "No path filtering (runs even for .md, .agents/ changes)"
    
    fix: "Add path filtering to skip CI for docs-only changes"
    potential_savings: "100% (27 min) for docs-only PRs"

# =============================================================================
# OPTIMIZATION STRATEGIES
# =============================================================================

optimization_strategies:
  
  strategy_1_intelligent_skipping:
    principle: "Don't run tests that can't fail for given changes"
    
    implementation:
      path_based_skipping:
        description: "Skip CI based on changed file paths"
        examples:
          - "docs-only: Skip entire CI"
          - ".agents/-only: Skip entire CI"
          - "README/LICENSE: Skip entire CI"
          - "CLI-only: Skip GUI tests"
          - "GUI-only: Skip CLI benchmarks"
      
      label_based_skipping:
        description: "Manual control via PR labels"
        examples:
          - "skip-ci: Skip all CI"
          - "skip-docker: Skip Docker tests"
          - "skip-benchmarks: Skip benchmarks"
          - "docs-only: Skip code tests"
      
      ci_directive_skipping:
        description: "Skip via commit message"
        examples:
          - "[skip ci]": Skip entire CI
          - "[ci fast]": Skip benchmarks + Docker
  
  strategy_2_caching:
    principle: "Cache expensive operations that rarely change"
    
    targets:
      cargo_registry:
        current_state: "Re-downloads dependencies every run"
        fix: "Cache ~/.cargo/registry"
        savings: "~1 minute per run"
      
      cargo_build:
        current_state: "Rebuilds from scratch every run"
        fix: "Cache target/ directory"
        savings: "~2-3 minutes per run"
      
      security_tools:
        current_state: "Reinstalls cargo-audit, cargo-deny every run"
        fix: "Cache ~/.cargo/bin/ for these tools"
        savings: "~2 minutes per run"
  
  strategy_3_parallelization:
    principle: "Run independent checks in parallel"
    
    current_state: "Some steps run sequentially unnecessarily"
    
    opportunities:
      - "fmt + clippy can run in parallel"
      - "Security checks can run parallel with tests"
      - "Different crates can be tested in parallel (matrix strategy)"
  
  strategy_4_tiered_ci:
    principle: "Fast checks first, expensive checks later/conditionally"
    
    tiers:
      tier_1_fast:
        duration: "<5 minutes"
        always_run: true
        checks:
          - "cargo fmt"
          - "cargo clippy"
          - "cargo test (unit tests only)"
      
      tier_2_comprehensive:
        duration: "5-15 minutes"
        run_if: "tier_1 passes + code changes"
        checks:
          - "cargo test (integration tests)"
          - "GUI automation tests"
          - "Security checks"
      
      tier_3_expensive:
        duration: ">15 minutes"
        run_if: "manual trigger OR release branch"
        checks:
          - "cargo bench"
          - "Docker tests"
          - "GTK4-native tests"
          - "Vagrant smoke tests"

# =============================================================================
# RECOMMENDED CHANGES
# =============================================================================

recommended_changes:
  
  priority_1_immediate:
    
    change_1_add_path_filtering:
      impact: "HIGH - Skips CI for docs-only PRs"
      effort: "5 minutes"
      savings: "27 min per docs-only PR"
      
      implementation:
        file: ".github/workflows/ci.yml"
        before: |
          on:
            push:
              branches: ["main"]
            pull_request:
              branches: ["main"]
        
        after: |
          on:
            push:
              branches: ["main"]
              paths-ignore:
                - '**.md'
                - 'docs/**'
                - '.agents/**'
                - 'LICENSE'
                - 'README.md'
            pull_request:
              branches: ["main"]
              paths-ignore:
                - '**.md'
                - 'docs/**'
                - '.agents/**'
                - 'LICENSE'
                - 'README.md'
      
      result: "CI skipped for docs-only changes"
    
    change_2_cache_security_tools:
      impact: "MEDIUM - Saves 2 min every run"
      effort: "10 minutes"
      savings: "2 min per run"
      
      implementation:
        file: ".github/workflows/ci.yml"
        add_before_install: |
          - name: Cache cargo tools
            uses: actions/cache@v4
            with:
              path: |
                ~/.cargo/bin/cargo-audit
                ~/.cargo/bin/cargo-deny
              key: ${{ runner.os }}-cargo-tools-${{ hashFiles('**/Cargo.lock') }}
          
          - name: Install security tooling
            run: |
              cargo install cargo-audit --locked || true
              cargo install cargo-deny --locked || true
      
      result: "Tools installed once, cached thereafter"
    
    change_3_make_benchmarks_optional:
      impact: "MEDIUM - Saves 3 min most PRs"
      effort: "5 minutes"
      savings: "3 min per run (when skipped)"
      
      implementation:
        file: ".github/workflows/ci.yml"
        change: |
          - name: Cargo bench (hash-checker)
            if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            run: cargo bench --manifest-path rust/hash-checker/Cargo.toml
      
      result: "Benchmarks only on main branch pushes"
  
  priority_2_high_value:
    
    change_4_conditional_docker_tests:
      impact: "MEDIUM - Saves 5 min when skipped"
      effort: "10 minutes"
      savings: "5 min per run (when Docker files unchanged)"
      
      implementation:
        file: ".github/workflows/ci.yml"
        add: |
          - name: Check if Docker files changed
            id: docker_changes
            run: |
              if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '(Dockerfile|docker/|Makefile)'; then
                echo "changed=true" >> $GITHUB_OUTPUT
              else
                echo "changed=false" >> $GITHUB_OUTPUT
              fi
          
          - name: Rust tests (Docker)
            if: steps.docker_changes.outputs.changed == 'true'
            run: make rust-test
      
      result: "Docker tests only when Docker files change"
    
    change_5_conditional_gtk4_tests:
      impact: "LOW - Saves 3 min when skipped"
      effort: "10 minutes"
      savings: "3 min per run (when GUI unchanged)"
      
      implementation:
        file: ".github/workflows/ci.yml"
        add: |
          - name: Check if GUI files changed
            id: gui_changes
            run: |
              if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '(rust/hash-checker-gui/)'; then
                echo "changed=true" >> $GITHUB_OUTPUT
              else
                echo "changed=false" >> $GITHUB_OUTPUT
              fi
          
          - name: GTK4-native compile check
            if: steps.gui_changes.outputs.changed == 'true'
            run: cargo check --manifest-path rust/hash-checker-gui/Cargo.toml --features gtk4-native
      
      result: "GTK4 tests only when GUI files change"
  
  priority_3_nice_to_have:
    
    change_6_cache_cargo_dependencies:
      impact: "MEDIUM - Saves 1-2 min per run"
      effort: "15 minutes"
      savings: "1-2 min per run"
      
      implementation:
        file: ".github/workflows/ci.yml"
        add_early: |
          - name: Cache cargo registry
            uses: actions/cache@v4
            with:
              path: |
                ~/.cargo/registry
                ~/.cargo/git
              key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      result: "Dependencies cached, faster builds"
    
    change_7_add_ci_fast_mode:
      impact: "LOW - Manual control for fast iterations"
      effort: "20 minutes"
      
      implementation:
        description: "Add PR label support for fast CI"
        logic: |
          if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci-fast') }}
        
        behavior:
          - "ci-fast label: Skip benchmarks, Docker, GTK4"
          - "no label: Run everything"
      
      result: "Developers can opt into fast CI for quick iterations"

