# =============================================================================
# INTERACTION PATTERNS (This Session)
# =============================================================================

session_patterns:
  
  question_correction_cycle:
    pattern:
      - "User asks question"
      - "AA interprets (sometimes incorrectly)"
      - "AA produces large output"
      - "User corrects interpretation"
      - "AA adjusts and produces better output"
    
    frequency: "3-4 times this session"
    cost: "High (redundant analysis)"
    improvement: "AA should ask clarifying questions BEFORE analysis"
  
  strategic_questioning:
    pattern:
      - "User asks 'what if' questions"
      - "Forces AA to think about edge cases"
      - "Uncovers critical gaps (e.g., git conflicts)"
    
    frequency: "Every major topic"
    impact: "Reveals AA blind spots, improves design"
  
  trust_then_verify:
    pattern:
      - "User trusts AA to plan"
      - "AA proposes approach"
      - "User validates critical points"
      - "User approves or redirects"
    
