# =============================================================================
# WIN-WIN GROWTH RECOMMENDATIONS
# =============================================================================

recommendations:
  
  for_user:
    
    communication_efficiency:
      action: "Add explicit scoping to open-ended questions"
      example: "'Analyze file formats' → 'Analyze file formats (AA-centric perspective, <500 words)'"
      benefit: "Prevents AA misinterpretation, saves tokens"
    
    early_intervention:
      action: "Interrupt AA when off-track (after 200 words, not 2,000)"
      example: "AA starts wrong direction → User says 'Stop, wrong angle' early"
      benefit: "Faster correction, less wasted effort"
    
    explicit_constraints:
      action: "State constraints upfront when known"
      example: "'Test this idea' → 'Test this idea (max 1 hour, document in 200 words)'"
      benefit: "AA knows boundaries, optimizes within them"
    
    brainstorm_signals:
      action: "Explicit signal for brainstorm vs quick answer"
      example: "'What do you think?' → 'Quick take (200 words)' or 'Deep brainstorm (2,000 words OK)'"
      benefit: "Right depth for right question"
  
  for_aa_cursor:
    
    clarify_before_analyze:
      action: "ALWAYS ask clarifying questions for multi-interpretation queries"
      example: "User asks about file formats → AA asks: 'Human-centric or AA-centric perspective?'"
      benefit: "Prevents wrong direction, saves rework"
    
    executive_summary_first:
      action: "Provide 200-word summary, get approval, then elaborate"
      example: "Approach: [Summary]. Should I continue?" → User: "Yes" or "No, shift to X""
      benefit: "Fast validation, prevents wasted deep analysis"
    
    test_before_theorize:
      action: "For uncertain hypotheses, test within 1 hour before writing 5,000 words"
      example: "AI vision hypothesis → Send 1 screenshot test → THEN analyze"
      benefit: "Evidence-based analysis, higher confidence"
    
    simplicity_check:
      action: "Before creating file, ask: 'Can I update existing? Is this necessary?'"
      example: "Before 18,000 word analysis → Ask: 'Quick test or deep analysis?'"
      benefit: "Prevents over-engineering"
  
  mutual_growth_actions:
    
    regular_retrospectives:
      frequency: "Every 3-5 sessions"
      format: "What worked? What didn't? How to improve?"
      benefit: "Continuous improvement for both sides"
    
    explicit_feedback_exchange:
      user_to_aa: "Constructive feedback (as done this session)"
      aa_to_user: "Patterns observed, suggestions (like this document)"
      benefit: "Two-way learning, Win-Win"
    
    experiment_and_iterate:
      action: "Try new approaches, measure results, refine"
      example: "Test 'ask before analyze' protocol → Measure token savings → Adjust"
      benefit: "Evidence-based collaboration improvement"

