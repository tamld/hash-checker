# =============================================================================
# PHASE 1: HEADLESS CLI CONTRACT (CRITICAL)
# =============================================================================

phase1:
  name: "Headless CLI Contract"
  priority: critical
  estimate: "2-3 hours"
  status: planned
  
  tasks:
    - id: p1-t1
      title: "Design headless CLI specification"
      estimate: "30 mins"
      status: pending
      description: |
        Create RFC-style spec defining:
        - Required flags: --headless, --snapshot, --exit-after-capture
        - Optional flags: --capture-golden, --compare-golden
        - Exit codes: 0=success, 1=diff, 2=error
        - Output format: JSON structure for state capture
      deliverable: ".agents/rfcs/headless_cli_spec.md"
      
    - id: p1-t2
      title: "Implement --headless flag"
      estimate: "45 mins"
      status: pending
      dependencies: [p1-t1]
      description: |
        Modify main.rs to:
        - Parse --headless flag
        - Run GUI without display server (if possible)
        - Or skip rendering, capture state only
      files:
        - rust/hash-checker-gui/src/main.rs
      tests:
        - "cargo run -- --headless (exits cleanly)"
        - "Returns exit code 0"
        
    - id: p1-t3
      title: "Implement --snapshot flag"
      estimate: "45 mins"  
      status: pending
      dependencies: [p1-t2]
      description: |
        Add snapshot capture:
        - Serialize GUI state to JSON
        - Include: window dimensions, widget states, theme, telemetry
        - Write to specified path
      files:
        - rust/hash-checker-gui/src/main.rs
        - rust/hash-checker-gui/src/snapshot.rs (new)
      tests:
        - "cargo run -- --headless --snapshot output.json"
        - "Verify output.json contains expected structure"
        
    - id: p1-t4
      title: "Implement exit-after-capture logic"
      estimate: "15 mins"
      status: pending
      dependencies: [p1-t3]
      description: |
        Ensure GUI exits cleanly after snapshot:
        - Don't enter event loop if --headless
        - Write snapshot and exit immediately
      tests:
        - "Command completes in <5 seconds"
        - "Exit code 0"
        
    - id: p1-t5
      title: "Add unit tests for headless mode"
      estimate: "30 mins"
      status: pending
      dependencies: [p1-t4]
      description: |
        Create tests:
        - Test headless flag parsing
        - Test snapshot generation
        - Test JSON schema validation
        - Test exit behavior
      files:
        - rust/hash-checker-gui/tests/headless_tests.rs (new)
      
  acceptance_criteria:
    - "cargo run -- --headless --snapshot test.json works"
    - "JSON output contains GUI state"
    - "Exits cleanly without display server"
    - "All unit tests pass"
    - "Documented in --help output"

# =============================================================================
# PHASE 2: GOLDEN MASTER STORAGE (CRITICAL)
# =============================================================================

phase2:
  name: "Golden Master Storage"
  priority: critical
  estimate: "1-2 hours"
  status: planned
  dependencies: [phase1]
  
  tasks:
    - id: p2-t1
      title: "Create golden master directory structure"
      estimate: "15 mins"
      status: pending
      description: |
        Create structure:
        test-fixtures/golden/
          ├── README.md (explains format)
          ├── linux/
          ├── macos/
          └── windows/
      deliverable: "test-fixtures/golden/ with README.md"
      
    - id: p2-t2
      title: "Define golden master JSON schema"
      estimate: "30 mins"
      status: pending
      description: |
        Document schema:
        {
          "version": "1.0.0",
          "platform": "linux|macos|windows",
          "timestamp": "2025-10-26T12:00:00Z",
          "scenario": "minimal-scan|deep-tree|verify-mismatches",
          "gui_state": {
            "window": { "width": 1280, "height": 800 },
            "active_tab": "file|folder",
            "widgets": [...],
            "theme": "dark|light"
          },
          "telemetry": {...}
        }
      deliverable: ".agents/rfcs/golden_master_schema.json"
      
    - id: p2-t3
      title: "Implement golden master save logic"
      estimate: "30 mins"
      status: pending
      dependencies: [p2-t1, p2-t2]
      description: |
        Add --capture-golden flag:
        - Takes scenario name as argument
        - Detects platform automatically
        - Saves to test-fixtures/golden/{platform}/{scenario}.json
        - Validates against schema
      files:
        - rust/hash-checker-gui/src/golden.rs (new)
      tests:
        - "cargo run -- --headless --capture-golden minimal-scan"
        - "Verify file created in correct location"
        
    - id: p2-t4
      title: "Capture initial golden masters"
      estimate: "20 mins"
      status: pending
      dependencies: [p2-t3]
      description: |
        Capture golden masters for scenarios:
        - minimal-scan (test-fixtures/sample.txt)
        - deep-tree (test-fixtures/gui-deep/)
        - verify-mismatches (after mutation)
      deliverable: "3+ golden master files"
      
  acceptance_criteria:
    - "test-fixtures/golden/ structure exists"
    - "Schema documented and validated"
    - "Golden masters captured for key scenarios"
    - "Platform detection works"
    - "README.md explains format"

# =============================================================================
# PHASE 3: COMPARISON LOGIC (CRITICAL)
# =============================================================================

phase3:
  name: "Comparison Logic"
  priority: critical
  estimate: "3-4 hours"
  status: planned
  dependencies: [phase2]
  
  tasks:
    - id: p3-t1
      title: "Design comparison strategy"
      estimate: "30 mins"
      status: pending
      description: |
        Define three comparison modes:
        - Exact: 0% tolerance, fail on any difference
        - Fuzzy: ±5px dimensions, ±5% colors (for platform differences)
        - Structural: Ignore timestamps/IDs, check logic only
        
        Start with Exact mode for MVP.
      deliverable: ".agents/rfcs/comparison_strategy.md"
      
    - id: p3-t2
      title: "Implement exact match comparator"
      estimate: "1 hour"
      status: pending
      dependencies: [p3-t1]
      description: |
        Create comparator:
        - Load golden master
        - Load current snapshot
        - Deep comparison (all fields)
        - Generate diff report
      files:
        - rust/hash-checker-gui/src/comparator.rs (new)
      tests:
        - Unit tests for exact matching
        - Test with identical snapshots (pass)
        - Test with different snapshots (fail with clear diff)
        
    - id: p3-t3
      title: "Implement --compare-golden flag"
      estimate: "45 mins"
      status: pending
      dependencies: [p3-t2]
      description: |
        Add CLI flag:
        - Takes scenario name
        - Captures current snapshot
        - Loads corresponding golden master
        - Runs comparison
        - Outputs diff to stdout and file
        - Exit code: 0=match, 1=diff, 2=error
      files:
        - rust/hash-checker-gui/src/main.rs
      tests:
        - Compare against golden (should match initially)
        - Modify fixture and compare (should detect diff)
        
    - id: p3-t4
      title: "Create diff formatter"
      estimate: "45 mins"
      status: pending
      dependencies: [p3-t3]
      description: |
        Format diff output:
        - JSON diff (machine-readable)
        - Human-readable text output
        - Highlight specific differences
        - Provide context for failures
      deliverable: "Clear, actionable diff reports"
      
    - id: p3-t5
      title: "Add comparison unit tests"
      estimate: "1 hour"
      status: pending
      dependencies: [p3-t4]
      description: |
        Comprehensive test suite:
        - Test exact matching
        - Test diff detection (various scenarios)
        - Test error handling (missing files, invalid JSON)
        - Test exit codes
      files:
        - rust/hash-checker-gui/tests/comparison_tests.rs (new)
      
  acceptance_criteria:
    - "cargo run -- --compare-golden minimal-scan works"
    - "Detects differences accurately"
    - "Clear diff output (JSON + human-readable)"
    - "Exit codes correct (0/1/2)"
    - "All comparison tests pass"

# =============================================================================
# PHASE 4: CI INTEGRATION (HIGH PRIORITY)
# =============================================================================

phase4:
  name: "CI Integration"
  priority: high
  estimate: "2-3 hours"
  status: planned
  dependencies: [phase3]
  
  tasks:
    - id: p4-t1
      title: "Create golden master CI workflow"
      estimate: "1 hour"
      status: pending
      description: |
        Create .github/workflows/golden-master-validation.yml:
        - Trigger: on PR, paths: rust/hash-checker-gui/**
        - Matrix: [ubuntu-latest, macos-latest, windows-latest]
        - Steps:
          1. Checkout code
          2. Setup Rust
          3. Build GUI
          4. Run golden master comparisons
          5. Upload diff artifacts on failure
      deliverable: ".github/workflows/golden-master-validation.yml"
      
    - id: p4-t2
      title: "Add artifact upload on failure"
      estimate: "30 mins"
      status: pending
      dependencies: [p4-t1]
      description: |
        Configure workflow:
        - Upload diff reports
        - Upload current snapshots
        - Upload comparison logs
        - Retention: 7 days
      
    - id: p4-t3
      title: "Run CI dry-run"
      estimate: "30 mins"
      status: pending
      dependencies: [p4-t2]
      notes: |
        Codex requested this in brainstorm.
        Collect baseline timings.
      description: |
        Trigger workflow on draft PR:
        - Document execution times
        - Verify matrix works on GitHub runners
        - Check artifact uploads
        - Document any platform-specific issues
      deliverable: ".agents/records/ci_dry_run_results.md"
      
    - id: p4-t4
      title: "Document CI integration"
      estimate: "30 mins"
      status: pending
      dependencies: [p4-t3]
      description: |
        Update docs/OPERATIONS.md:
        - How to capture golden masters
        - How to update golden masters (approval process)
        - How to debug CI failures
        - How to download artifacts
      
  acceptance_criteria:
    - "CI workflow created and tested"
    - "Runs on all platforms (Linux/macOS/Windows)"
    - "Fails correctly on regression"
    - "Artifacts uploaded on failure"
    - "Documentation complete"

