# =============================================================================
# DECISION POINTS (NEEDS TEAM INPUT)
# =============================================================================

decision_points:
  - id: dp-1
    question: "Golden master format: JSON state only or JSON + PNG screenshots?"
    options:
      - "JSON only (simpler, faster, platform-independent)"
      - "JSON + PNG (catches visual regressions but complex)"
      - "JSON now, PNG later (phased approach)"
    recommendation: "JSON only for MVP, PNG as future enhancement"
    blocked_tasks: []
    
  - id: dp-2
    question: "Platform strategy: All platforms now or Linux-first?"
    options:
      - "All platforms (Linux/macOS/Windows) from start"
      - "Linux-first, add others after validation"
    recommendation: "Linux-first for faster iteration, add others in Phase 4"
    blocked_tasks: [p2-t4, p4-t1]
    
  - id: dp-3
    question: "Scope: MVP (Phase 1-3) or Full (Phase 1-5)?"
    options:
      - "MVP: Phases 1-3 only (~7-9 hours)"
      - "Full: All 5 phases (~10-15 hours)"
    recommendation: "MVP first, Phase 4-5 in follow-up PR"
    blocked_tasks: []
    
  - id: dp-4
    question: "Timeline: 1 sprint (2 weeks) or 2 sprints (4 weeks)?"
    options:
      - "1 sprint: MVP only, fast delivery"
      - "2 sprints: Full implementation, more thorough"
    recommendation: "1 sprint for MVP, 2nd sprint for polish + Phase 4-5"
    blocked_tasks: []

