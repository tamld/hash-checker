name: Distribution Dry Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  cargo_dist_dry_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Install cargo-dist
        run: |
          cargo install cargo-dist@0.30.0 --locked
          ln -sfn "$HOME/.cargo/bin/dist" "$HOME/.cargo/bin/cargo-dist"

      - name: Cargo dist plan
        run: |
          dist plan --output-format json > dist-plan.json
          dist manifest --artifacts all --output-format json --no-local-paths > dist-manifest.json

      - name: Upload dist manifest
        uses: actions/upload-artifact@v4
        with:
          name: dist-plan
          path: |
            dist-plan.json
            dist-manifest.json

  debian_smoke:
    runs-on: ubuntu-latest
    needs: cargo_dist_dry_run
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev xdg-desktop-portal xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Run Debian smoke script
        run: |
          chmod +x scripts/debian-smoke.sh
          ./scripts/debian-smoke.sh

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debian-smoke-logs
          path: |
            logs/cli-snapshots/*.log
            rust/hash-checker-gui/target/packager/**/*.deb
