name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_linux:
        description: "Run the Linux job"
        type: boolean
        default: true
      run_macos:
        description: "Run the macOS job"
        type: boolean
        default: true
      run_windows:
        description: "Run the Windows job"
        type: boolean
        default: true
      run_packaging:
        description: "Run cargo-dist packaging rehearsal (Linux job only)"
        type: boolean
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      VAGRANT_ENABLED: 'false'
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.run_linux == 'true') && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-linux-ci')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev xdg-desktop-portal
      - name: Cargo fmt (hash-checker)
        run: cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
      - name: Cargo fmt (hash-checker-gui)
        run: cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy (hash-checker)
        run: cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
      - name: Cargo clippy (hash-checker-gui)
        run: cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test (hash-checker)
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: GUI automation tests (hash-checker-gui)
        run: cargo test --manifest-path rust/hash-checker-gui/Cargo.toml --all
      - name: Cargo bench (hash-checker)
        run: cargo bench --manifest-path rust/hash-checker/Cargo.toml
      - name: Rust tests (Docker)
        run: make rust-test
      - name: GUI smoke test (host)
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Install cargo-dist
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_packaging == 'true' }}
        run: cargo install cargo-dist@0.30.0 --locked
      - name: cargo-dist manifest
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_packaging == 'true' }}
        run: ~/.cargo/bin/dist manifest --host x86_64-unknown-linux-gnu --output-format json > dist-manifest.json
      - name: cargo-dist build dry run
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_packaging == 'true' }}
        run: ~/.cargo/bin/dist build --host x86_64-unknown-linux-gnu --dry-run
      # Packaging validation is handled by the release workflow (cargo-packager).
      # CI defaults stay fast; turn on run_packaging for dress rehearsals.
      - name: Optional Vagrant GUI smoke
        if: env.VAGRANT_ENABLED == 'true'
        run: ./scripts/vagrant-gui-smoke.sh

      - name: Install security tooling
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Cargo audit (hash-checker)
        working-directory: rust/hash-checker
        run: cargo audit
      - name: Cargo audit (hash-checker-gui)
        working-directory: rust/hash-checker-gui
        run: cargo audit
      - name: Cargo deny (advisories)
        working-directory: rust/hash-checker
        run: cargo deny check advisories
      # Packaging steps are deferred to release workflows to preserve CI minutes.

  macos:
    runs-on: macos-14
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_macos == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
      - name: Install build dependencies
        run: |
          brew update
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
      - name: Cargo fmt
        run: |
          cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
          cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy
        run: |
          cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: Build CLI & GUI
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: GUI smoke test
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.7 --locked
      # DMG packaging is executed by the release workflow only.

  windows:
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_windows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          target: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Cargo fmt
        run: |
          cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
          cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy
        run: |
          cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: Build CLI & GUI
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: GUI smoke test
        shell: pwsh
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      # Windows installers (portable + NSIS) are built only in the release workflow.
