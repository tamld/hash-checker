name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: clippy, rustfmt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev
      - name: Cargo fmt (hash-checker)
        run: cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
      - name: Cargo fmt (hash-checker-gui)
        run: cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy (hash-checker)
        run: cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
      - name: Cargo clippy (hash-checker-gui)
        run: cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test (hash-checker)
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: Legacy Python tests (Docker)
        run: make python-test
      - name: Rust tests (Docker)
        run: make rust-test
      - name: Build Rust GUI in Docker
        run: make rust-gui-build
      - name: GUI smoke test (host)
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Package artefacts
        run: |
          rm -rf dist
          mkdir -p dist/linux
          cp rust/hash-checker/target/release/hash-checker dist/linux/
          cp rust/hash-checker-gui/target/release/hash-checker-gui dist/linux/
          sha256sum dist/linux/* > dist/linux/SHA256SUMS
          tar -czf dist/hash-checker-linux.tar.gz -C dist/linux .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/hash-checker-linux.tar.gz

  macos:
    needs: linux
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: clippy, rustfmt
      - name: Install GTK dependencies
        run: |
          brew update
          brew install gtk+3 pkg-config
      - name: Cargo fmt
        run: |
          cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
          cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy
        run: |
          cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: Build CLI & GUI
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: GUI smoke test
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Package artefacts
        run: |
          rm -rf dist
          mkdir -p dist/macos
          cp rust/hash-checker/target/release/hash-checker dist/macos/
          cp rust/hash-checker-gui/target/release/hash-checker-gui dist/macos/
          shasum -a 256 dist/macos/* > dist/macos/SHA256SUMS
          tar -czf dist/hash-checker-macos.tar.gz -C dist/macos .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/hash-checker-macos.tar.gz

  windows:
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          profile: minimal
          components: clippy, rustfmt
      - name: Cargo fmt
        run: |
          cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
          cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy
        run: |
          cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: Build CLI & GUI
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: GUI smoke test
        shell: pwsh
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Package artefacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist\win | Out-Null
          Copy-Item "rust/hash-checker/target/release/hash-checker.exe" dist/win/
          Copy-Item "rust/hash-checker-gui/target/release/hash-checker-gui.exe" dist/win/
          Get-FileHash dist\win\hash-checker.exe -Algorithm SHA256 | ForEach-Object { $_.Hash + "  hash-checker.exe" } > dist/win/SHA256SUMS
          Get-FileHash dist\win\hash-checker-gui.exe -Algorithm SHA256 | ForEach-Object { $_.Hash + "  hash-checker-gui.exe" } >> dist/win/SHA256SUMS
          Compress-Archive -Path dist\win\* -DestinationPath dist\hash-checker-windows.zip -Force
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/hash-checker-windows.zip
