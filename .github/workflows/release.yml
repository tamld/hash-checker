name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_linux:
        description: "Run Linux packaging job"
        type: boolean
        default: true
      run_macos:
        description: "Run macOS packaging job"
        type: boolean
        default: true
      run_windows:
        description: "Run Windows packaging job"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      VAGRANT_ENABLED: 'false'
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_linux == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev
      - name: Cargo fmt (hash-checker)
        run: cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
      - name: Cargo fmt (hash-checker-gui)
        run: cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy (hash-checker)
        run: cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
      - name: Cargo clippy (hash-checker-gui)
        run: cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test (hash-checker)
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: GUI automation tests (hash-checker-gui)
        run: cargo test --manifest-path rust/hash-checker-gui/Cargo.toml --all
      - name: Rust tests (Docker)
        run: make rust-test
      - name: GUI smoke test (host)
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Smoke test release binaries
        run: |
          ./rust/hash-checker/target/release/hash-checker --help > /dev/null
          ./rust/hash-checker-gui/target/release/hash-checker-gui --smoke-test
      - name: Optional Vagrant GUI smoke
        if: env.VAGRANT_ENABLED == 'true'
        run: ./scripts/vagrant-gui-smoke.sh

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.7 --locked
      - name: Build Linux installer (.deb)
        run: cargo packager --release --formats deb
        working-directory: rust/hash-checker-gui
      - name: Build Linux AppImage
        run: cargo packager --release --formats appimage
        working-directory: rust/hash-checker-gui
      - name: Build Arch package (pacman)
        run: cargo packager --release --formats pacman
        working-directory: rust/hash-checker-gui
      - name: Collect Linux artefacts
        run: |
          rm -rf dist/linux
          mkdir -p dist/linux
          cp rust/hash-checker-gui/target/packager/*.deb dist/linux/ 2>/dev/null || true
          cp rust/hash-checker-gui/target/packager/*.AppImage dist/linux/ 2>/dev/null || true
          cp rust/hash-checker-gui/target/packager/*.tar.gz dist/linux/ 2>/dev/null || true
          if ls dist/linux/* >/dev/null 2>&1; then
            sha256sum dist/linux/* > dist/linux/SHA256SUMS
          fi
      - name: Upload Linux artefacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: dist/linux

  macos:
    runs-on: macos-14
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_macos == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install GTK dependencies
        run: |
          brew update
          brew list gtk+3 >/dev/null 2>&1 || brew install gtk+3
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
      - name: Cargo fmt
        run: |
          cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
          cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy
        run: |
          cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: Build CLI & GUI
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: GUI smoke test
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Smoke test release binaries
        run: |
          ./rust/hash-checker/target/release/hash-checker --help > /dev/null
          ./rust/hash-checker-gui/target/release/hash-checker-gui --smoke-test
      - name: Optional Vagrant GUI smoke
        if: env.VAGRANT_ENABLED == 'true'
        run: ./scripts/vagrant-gui-smoke.sh

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.7 --locked
      - name: Build macOS installer (.dmg)
        run: cargo packager --release --formats dmg
        working-directory: rust/hash-checker-gui
      - name: Collect macOS artefacts
        run: |
          rm -rf dist/macos
          mkdir -p dist/macos
          cp rust/hash-checker-gui/target/packager/*.dmg dist/macos/
          shasum -a 256 dist/macos/*.dmg > dist/macos/SHA256SUMS
      - name: Upload macOS artefacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/macos

  windows:
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_windows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Cargo fmt
        run: |
          cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
          cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy
        run: |
          cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: Build CLI & GUI
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: GUI smoke test
        shell: pwsh
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Install packaging toolchain
        shell: pwsh
        run: |
          cargo install cargo-packager@0.11.7 --locked
          choco install nsis --no-progress -y
      - name: Build Windows installer (NSIS)
        shell: pwsh
        run: cargo packager --release --formats nsis --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: Prepare Windows artefacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist\win\portable | Out-Null
          Copy-Item 'rust\hash-checker\target\release\hash-checker.exe' -Destination 'dist\win\portable\hash-checker.exe'
          Copy-Item 'rust\hash-checker-gui\target\release\hash-checker-gui.exe' -Destination 'dist\win\portable\hash-checker-gui.exe'
          (Get-FileHash dist\win\portable\hash-checker.exe -Algorithm SHA256).Hash + "  hash-checker.exe" | Set-Content -Encoding ASCII dist\win\portable\SHA256SUMS
          (Get-FileHash dist\win\portable\hash-checker-gui.exe -Algorithm SHA256).Hash + "  hash-checker-gui.exe" | Add-Content -Encoding ASCII dist\win\portable\SHA256SUMS
          Compress-Archive -Path dist\win\portable\* -DestinationPath dist\hash-checker-windows-portable.zip -Force
          New-Item -ItemType Directory -Path dist\win\installer | Out-Null
          Copy-Item 'rust\hash-checker-gui\target\packager\*.exe' -Destination 'dist\win\installer'
          Copy-Item 'rust\hash-checker-gui\target\packager\SHA256SUMS' -Destination 'dist\win\installer\SHA256SUMS'
      - name: Upload Windows artefacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/hash-checker-windows-portable.zip
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/win/installer
      - name: Smoke test portable archive
        shell: pwsh
        run: |
          Expand-Archive dist/hash-checker-windows-portable.zip -DestinationPath smoke -Force
          .\smoke\hash-checker.exe --help | Out-Null
          .\smoke\hash-checker-gui.exe --smoke-test

  publish:
    runs-on: ubuntu-latest
    needs: [linux, macos, windows]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_linux == 'true' && github.event.inputs.run_macos == 'true' && github.event.inputs.run_windows == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: List artefacts
        run: ls -R release-artifacts
      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.30.0
      - name: Generate cargo-dist manifest
        run: ~/.cargo/bin/dist manifest --output-format json > release-artifacts/dist-manifest.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/linux-installers/*
            release-artifacts/macos-installers/*
            release-artifacts/windows-portable/*
            release-artifacts/windows-installer/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
