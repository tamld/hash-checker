name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Pre-Flight SSoT & Version Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSoT Version & Tag Alignment
        run: |
          chmod +x tools/ci_version_sync.sh tools/ci_spec_code_sync.sh tools/ci_structure_sync.sh tools/ci_link_integrity.sh
          ./tools/ci_version_sync.sh
          ./tools/ci_spec_code_sync.sh
          ./tools/ci_structure_sync.sh
          ./tools/ci_link_integrity.sh
          TAG_VER="${GITHUB_REF_NAME#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          if [ "${TAG_VER}" != "${FILE_VER}" ]; then
            echo "::error::Tag version (${TAG_VER}) does not match VERSION (${FILE_VER})"
            exit 1
          fi

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            patchelf \
            desktop-file-utils \
            squashfs-tools \
            wget \
            file \
            dpkg-dev \
            rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.7 --locked

      - name: Build CLI and GUI binaries
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml

      - name: Package portable Linux archive & desktop installers
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist/linux dist/linux-portable
          cp rust/hash-checker/target/release/hash-checker dist/linux-portable/
          cp rust/hash-checker-gui/target/release/hash-checker-gui dist/linux-portable/
          cp LICENSE README.md dist/linux-portable/
          tar -czf "dist/linux/hash-checker_${VER}_linux_amd64.tar.gz" -C dist/linux-portable hash-checker hash-checker-gui LICENSE README.md

          cargo packager --release --formats deb,appimage --manifest-path rust/hash-checker-gui/Cargo.toml
          for f in rust/hash-checker-gui/target/packager/*.deb rust/hash-checker-gui/target/packager/*.AppImage rust/hash-checker-gui/target/packager/*.tar.gz; do
            [ -e "$f" ] && cp "$f" dist/linux/
          done
          (cd dist/linux && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: dist/linux/*

  macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.7 --locked

      - name: Build universal CLI & GUI binaries + macOS DMG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          chmod +x scripts/macos-universal-dmg.sh
          ./scripts/macos-universal-dmg.sh
          mkdir -p dist/macos
          cp dist/macos-universal/*.dmg dist/macos/
          cp "dist/macos-universal/hash-checker_${VER}_darwin_all.tar.gz" dist/macos/
          (cd dist/macos && shasum -a 256 * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/macos/*

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.7 --locked

      - name: Build CLI and GUI binaries
        shell: bash
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml

      - name: Package Windows NSIS installer and portable ZIPs
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cargo packager --release --formats nsis --manifest-path rust/hash-checker-gui/Cargo.toml
          mkdir -p dist/windows
          for f in rust/hash-checker-gui/target/packager/*-setup.exe rust/hash-checker-gui/target/packager/*.msi; do
            [ -e "$f" ] && cp "$f" dist/windows/
          done
          powershell -NoProfile -Command "Compress-Archive -Path 'rust/hash-checker/target/release/hash-checker.exe','rust/hash-checker-gui/target/release/hash-checker-gui.exe','LICENSE','README.md' -DestinationPath 'dist/windows/hash-checker_${VER}_windows_amd64.zip' -Force"
          cp "dist/windows/hash-checker_${VER}_windows_amd64.zip" "dist/windows/hash-checker-windows-portable.zip"
          (cd dist/windows && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/windows/*

  publish:
    needs: [verify, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Consolidate release assets & generate unified checksums
        run: |
          mkdir -p release-assets
          for f in dist/linux-installers/* dist/macos-installers/* dist/windows-installers/*; do
            base="$(basename "$f")"
            if [ -f "$f" ] && [ "$base" != "SHA256SUMS" ] && [ "$base" != "checksums.txt" ]; then
              cp "$f" release-assets/
            fi
          done
          (cd release-assets && sha256sum * | sort -k2 > checksums.txt && cp checksums.txt SHA256SUMS)
          ls -lh release-assets/
          cat release-assets/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
