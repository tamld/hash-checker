name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_linux:
        description: "Run Linux packaging job"
        type: boolean
        default: true
      run_macos:
        description: "Run macOS packaging job"
        type: boolean
        default: true
      run_windows:
        description: "Run Windows packaging job"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      VAGRANT_ENABLED: 'false'
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_linux == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev
      - name: Cargo fmt (hash-checker)
        run: cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
      - name: Cargo fmt (hash-checker-gui)
        run: cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy (hash-checker)
        run: cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
      - name: Cargo clippy (hash-checker-gui)
        run: cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test (hash-checker)
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: GUI automation tests (hash-checker-gui)
        run: cargo test --manifest-path rust/hash-checker-gui/Cargo.toml --all
      - name: Rust tests (Docker)
        run: make rust-test
      - name: GUI smoke test (host)
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Smoke test release binaries
        run: |
          ./rust/hash-checker/target/release/hash-checker --help > /dev/null
          ./rust/hash-checker-gui/target/release/hash-checker-gui --smoke-test
      - name: Optional Vagrant GUI smoke
        if: env.VAGRANT_ENABLED == 'true'
        run: ./scripts/vagrant-gui-smoke.sh

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.7 --locked
      - name: Build Linux installer (.deb)
        run: cargo packager --release --formats deb
        working-directory: rust/hash-checker-gui
      - name: Build Linux AppImage
        run: cargo packager --release --formats appimage
        working-directory: rust/hash-checker-gui
      - name: Build Arch package (pacman)
        run: cargo packager --release --formats pacman
        working-directory: rust/hash-checker-gui
      - name: Collect Linux artefacts
        run: |
          rm -rf dist/linux
          mkdir -p dist/linux
          cp rust/hash-checker-gui/target/packager/*.deb dist/linux/ 2>/dev/null || true
          cp rust/hash-checker-gui/target/packager/*.AppImage dist/linux/ 2>/dev/null || true
          cp rust/hash-checker-gui/target/packager/*.tar.gz dist/linux/ 2>/dev/null || true
          if ls dist/linux/* >/dev/null 2>&1; then
            sha256sum dist/linux/* > dist/linux/SHA256SUMS
          fi
      - name: Upload Linux artefacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: dist/linux

  macos:
    runs-on: macos-14
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_macos == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install GTK dependencies
        run: |
          brew update
          brew list gtk+3 >/dev/null 2>&1 || brew install gtk+3
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
      - name: Cargo fmt
        run: |
          cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
          cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy
        run: |
          cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: Build CLI & GUI
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: GUI smoke test
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Smoke test release binaries
        run: |
          ./rust/hash-checker/target/release/hash-checker --help > /dev/null
          ./rust/hash-checker-gui/target/release/hash-checker-gui --smoke-test
      - name: Optional Vagrant GUI smoke
        if: env.VAGRANT_ENABLED == 'true'
        run: ./scripts/vagrant-gui-smoke.sh

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.7 --locked
      - name: Build macOS installer (.dmg)
        run: cargo packager --release --formats dmg
        working-directory: rust/hash-checker-gui
      - name: Collect macOS artefacts
        run: |
          rm -rf dist/macos
          mkdir -p dist/macos
          cp rust/hash-checker-gui/target/packager/*.dmg dist/macos/
          shasum -a 256 dist/macos/*.dmg > dist/macos/SHA256SUMS
      - name: Upload macOS artefacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/macos

  windows:
    runs-on: windows-latest
    outputs:
      cli_artifact_id: ${{ steps.upload_cli_unsigned.outputs.artifact-id }}
      gui_artifact_id: ${{ steps.upload_gui_unsigned.outputs.artifact-id }}
      installer_artifact_id: ${{ steps.upload_installer_unsigned.outputs.artifact-id }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_windows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Cargo fmt
        run: |
          cargo fmt --manifest-path rust/hash-checker/Cargo.toml --check
          cargo fmt --manifest-path rust/hash-checker-gui/Cargo.toml --check
      - name: Cargo clippy
        run: |
          cargo clippy --manifest-path rust/hash-checker/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/hash-checker-gui/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/hash-checker/Cargo.toml --all
      - name: Build CLI & GUI
        run: |
          cargo build --release --manifest-path rust/hash-checker/Cargo.toml
          cargo build --release --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: GUI smoke test
        shell: pwsh
        run: cargo run --manifest-path rust/hash-checker-gui/Cargo.toml --release -- --smoke-test
      - name: Install packaging toolchain
        shell: pwsh
        run: |
          cargo install cargo-packager@0.11.7 --locked
          choco install nsis --no-progress -y
      - name: Build Windows installer (NSIS)
        shell: pwsh
        run: cargo packager --release --formats nsis --manifest-path rust/hash-checker-gui/Cargo.toml
      - name: Prepare Windows artefacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist\win\bin | Out-Null
          New-Item -ItemType Directory -Path dist\win\portable | Out-Null
          New-Item -ItemType Directory -Path dist\win\installer | Out-Null
          Copy-Item 'rust\hash-checker\target\release\hash-checker.exe' -Destination 'dist\win\bin\hash-checker.exe'
          Copy-Item 'rust\hash-checker-gui\target\release\hash-checker-gui.exe' -Destination 'dist\win\bin\hash-checker-gui.exe'
          Copy-Item 'dist\win\bin\hash-checker.exe' -Destination 'dist\win\portable\hash-checker.exe'
          Copy-Item 'dist\win\bin\hash-checker-gui.exe' -Destination 'dist\win\portable\hash-checker-gui.exe'
          Compress-Archive -Path dist\win\portable\* -DestinationPath dist\hash-checker-windows-portable.zip -Force
          $installerSource = Get-ChildItem 'rust\hash-checker-gui\target\packager\*.exe' | Select-Object -First 1
          if (-not $installerSource) { throw 'Installer executable not found under rust\hash-checker-gui\target\packager' }
          Copy-Item $installerSource.FullName -Destination 'dist\win\installer\hash-checker-gui-setup.exe' -Force
      - name: Upload CLI binary (unsigned)
        id: upload_cli_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli-unsigned
          path: dist/win/bin/hash-checker.exe
      - name: Upload GUI binary (unsigned)
        id: upload_gui_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-unsigned
          path: dist/win/bin/hash-checker-gui.exe
      - name: Upload Windows installer (unsigned)
        id: upload_installer_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: dist/win/installer/hash-checker-gui-setup.exe
      - name: Upload Windows portable archive (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-unsigned
          path: dist/hash-checker-windows-portable.zip
      - name: Smoke test portable archive
        shell: pwsh
        run: |
          Expand-Archive dist/hash-checker-windows-portable.zip -DestinationPath smoke -Force
          .\smoke\hash-checker.exe --help | Out-Null
          .\smoke\hash-checker-gui.exe --smoke-test

  windows_sign:
    name: Sign Windows artefacts
    runs-on: ubuntu-latest
    needs: windows
    if: ${{ needs.windows.outputs.cli_artifact_id != '' && needs.windows.outputs.gui_artifact_id != '' && needs.windows.outputs.installer_artifact_id != '' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit signing request (CLI)
        id: sign_cli
        uses: signpath/github-actions/actions/submit-signing-request@v0.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.cli_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed/cli
      - name: Submit signing request (GUI)
        id: sign_gui
        uses: signpath/github-actions/actions/submit-signing-request@v0.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.gui_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed/gui
      - name: Submit signing request (Installer)
        id: sign_installer
        uses: signpath/github-actions/actions/submit-signing-request@v0.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.installer_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed/installer
      - name: Repackage signed portable bundle
        run: |
          set -euo pipefail
          mkdir -p signed/portable
          cp signed/cli/*.exe signed/portable/hash-checker.exe
          cp signed/gui/*.exe signed/portable/hash-checker-gui.exe
          pushd signed/portable
          sha256sum hash-checker.exe hash-checker-gui.exe > SHA256SUMS
          zip -r ../hash-checker-windows-portable-signed.zip hash-checker.exe hash-checker-gui.exe SHA256SUMS
          popd
      - name: Generate installer checksum
        run: |
          set -euo pipefail
          sha256sum signed/installer/*.exe > signed/installer/SHA256SUMS
      - name: Upload signed CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli-signed
          path: signed/cli
      - name: Upload signed GUI binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-signed
          path: signed/gui
      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-signed
          path: signed/installer
      - name: Upload signed portable archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-signed
          path: |
            signed/hash-checker-windows-portable-signed.zip
            signed/portable/SHA256SUMS

  publish:
    runs-on: ubuntu-latest
    needs: [linux, macos, windows]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_linux == 'true' && github.event.inputs.run_macos == 'true' && github.event.inputs.run_windows == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: List artefacts
        run: ls -R release-artifacts
      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.30.0
      - name: Prepare release payload directory
        run: mkdir -p release-final
      - name: Generate cargo-dist manifest
        run: ~/.cargo/bin/dist manifest --output-format json > release-final/dist-manifest.json
      - name: Assemble release payload
        run: |
          set -euo pipefail
          mkdir -p release-final/linux
          if [ -d release-artifacts/linux-installers ]; then
            cp -R release-artifacts/linux-installers/. release-final/linux/
          fi
          mkdir -p release-final/macos
          if [ -d release-artifacts/macos-installers ]; then
            cp -R release-artifacts/macos-installers/. release-final/macos/
          fi
          mkdir -p release-final/windows
          if [ -d release-artifacts/windows-installer-signed ]; then
            cp -R release-artifacts/windows-installer-signed/. release-final/windows/
          elif [ -d release-artifacts/windows-installer-unsigned ]; then
            cp -R release-artifacts/windows-installer-unsigned/. release-final/windows/
          fi
          if [ -d release-artifacts/windows-portable-signed ]; then
            cp -R release-artifacts/windows-portable-signed/. release-final/windows/
          elif [ -d release-artifacts/windows-portable-unsigned ]; then
            cp -R release-artifacts/windows-portable-unsigned/. release-final/windows/
          fi
          if [ -d release-artifacts/windows-cli-signed ]; then
            cp -R release-artifacts/windows-cli-signed/. release-final/windows/
          fi
          if [ -d release-artifacts/windows-gui-signed ]; then
            cp -R release-artifacts/windows-gui-signed/. release-final/windows/
          fi
      - name: Generate release SHA256SUMS
        run: |
          set -euo pipefail
          cd release-final
          mapfile -d '' files < <(find . -type f ! -name 'SHA256SUMS' ! -name '*.sig' -print0)
          : > SHA256SUMS
          if [ "${#files[@]}" -gt 0 ]; then
            printf '%s\0' "${files[@]}" | sort -z | xargs -0 sha256sum >> SHA256SUMS
          fi
      - name: Import GPG signing key
        id: import_gpg
        if: ${{ secrets.GPG_PRIVATE_KEY != '' && secrets.GPG_PASSPHRASE != '' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign release checksums
        if: ${{ steps.import_gpg.conclusion == 'success' }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --output release-final/SHA256SUMS.sig --detach-sign release-final/SHA256SUMS
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-final/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
