[package]
name = "hash-checker"
version = "0.1.1"
edition = "2021"
authors = ["tamld <tamld@users.noreply.github.com>"]
description = "Cross-platform hash verification utility implemented in Rust."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
digest = "0.10"
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
thiserror = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
