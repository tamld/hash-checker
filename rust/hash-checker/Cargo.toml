[package]
name = "hash-checker"
version = "0.1.4"
edition = "2021"
authors = ["tamld <tamld@users.noreply.github.com>"]
description = "Cross-platform hash verification utility implemented in Rust."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
digest = "0.10"
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }

[dev-dependencies]
criterion = "0.5"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bench]]
name = "hash_bench"
harness = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
