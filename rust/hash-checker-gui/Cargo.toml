[package]
name = "hash-checker-gui"
version = "0.1.5"
edition = "2021"
authors = ["tamld <tamld@users.noreply.github.com>"]
description = "egui-based desktop interface for the Hash Checker tool."
license = "MIT"
repository = "https://github.com/tamld/hash-checker"

[features]
default = []
gtk4-native = ["gtk"]

[dependencies]
hash-checker = { path = "../hash-checker" }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.33"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.24", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
gtk = { package = "gtk4", version = "0.8", optional = true, features = ["v4_10"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[package.metadata.packager]
product-name = "Hash Checker"
identifier = "com.hashchecker.gui"
description = "Cross-platform hash verification GUI."
before-packaging-command = "cargo build --release"
out-dir = "target/packager"
icons = [
    "../../docs/assets/icon-hash-checker-256.png",
    "../../docs/assets/icon-hash-checker-512.png",
    "../../docs/assets/icon-hash-checker-1024.png",
    "../../docs/assets/icon-hash-checker.icns",
    "../../docs/assets/icon-hash-checker.ico",
]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["windef", "winuser"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
