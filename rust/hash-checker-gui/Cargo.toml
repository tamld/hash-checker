[package]
name = "hash-checker-gui"
version = "0.1.1"
edition = "2021"
authors = ["tamld <tamld@users.noreply.github.com>"]
description = "egui-based desktop interface for the Hash Checker tool."
license = "MIT"

[dependencies]
hash-checker = { path = "../hash-checker" }
eframe = { version = "0.24", default-features = false, features = ["glow"] }
egui = "0.24"
rfd = "0.11"
image = { version = "0.24", default-features = false, features = ["png"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[package.metadata.packager]
product-name = "Hash Checker"
identifier = "com.hashchecker.gui"
description = "Cross-platform hash verification GUI."
before-packaging-command = "cargo build --release"
out-dir = "target/packager"
icons = [
    "../../docs/assets/icon-hash-checker-256.png",
    "../../docs/assets/icon-hash-checker-512.png",
    "../../docs/assets/icon-hash-checker-1024.png",
    "../../docs/assets/icon-hash-checker.icns",
    "../../docs/assets/icon-hash-checker.ico",
]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["windef", "winuser"] }
